name: Generar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ver archivos subidos
        run: find . -not -path './.git/*' -type f | sort

      - name: Compilar APK
        run: |
          SETTINGS=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then echo "No encontré settings.gradle: faltan archivos del proyecto"; exit 1; fi
          cd "$(dirname "$SETTINGS")"
          echo "Proyecto en: $(pwd)"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/salida"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/salida/SkillSwap.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SkillSwap-APK
          path: salida/SkillSwap.apk
